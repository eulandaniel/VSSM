{% extends "base.html" %}

{% block content %}

<div class="phase-header">
    <span class="eyebrow">Fase 1 · Base rotulada</span>
    <h1>Carregamento da base de validação</h1>
    <p>Importe uma base rotulada para iniciar a validação semântica dos modelos.</p>
</div>

<form method="POST" enctype="multipart/form-data">

    <div class="upload-layout">

        <div class="upload-card">

            <label class="dropzone" for="file-upload">

                <input
                    type="file"
                    id="file-upload"
                    name="dataset"
                    accept=".csv,.xlsx"
                    required
                >

                <div class="upload-icon">⬆</div>

                <h2>Importar base de validação</h2>

                <p class="upload-main-text">
                    Arraste ou selecione um arquivo para continuar
                </p>

                <span class="upload-info">
                    CSV • XLSX • até 50MB
                </span>

                <button type="button" class="select-file-btn">
                    Selecionar arquivo
                </button>

                <div class="selected-file" id="selected-file">
                    Nenhum arquivo selecionado
                </div>

            </label>

            <button type="submit" class="btn primary upload-btn">
                Carregar e continuar
            </button>

        </div>

    </div>

</form>


{% endblock %}
